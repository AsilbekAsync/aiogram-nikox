[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aiogram-start-template"
version = "0.1.0"
description = "Async aiogram 3.x bot starter template with MySQL, Alembic, FSM"
requires-python = ">=3.10"
dependencies = [
    "aiogram>=3.0,<4.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "asyncmy>=0.2,<0.3",
    "alembic>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",
]
